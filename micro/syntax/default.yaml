filetype: unknown

detect:
    filename: ""

rules:
    - comment: "(^|\\s)#.*$"
    - comment: "(^|\\s)//.*$"

    - constant.string:
        start: "\""
        end: "\""
        skip: "\\\\."
        rules: []

    - constant.string:
        start: "'"
        end: "'"
        skip: "\\\\."
        rules: []

    - constant.number: "\\b[0-9]+(\\.[0-9]+)?\\b"

    # Mails
    - special: "[[:alnum:].%_+-]+@[[:alnum:].-]+"
    # URLs
    - identifier: "(https?|ftp|ssh)://\\S*[^])>\\s,.]"
